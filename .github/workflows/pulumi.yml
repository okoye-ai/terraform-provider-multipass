name: Pulumi compatibility

on:
  push:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'examples/pulumi/**'
      - 'tests/pulumi/**'
      - '.github/workflows/pulumi.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'examples/pulumi/**'
      - 'tests/pulumi/**'
      - '.github/workflows/pulumi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Schema, SDKs, and previews (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pulumi/actions@v7
        with:
          pulumi-version: '3.266.0'
      - name: Check the local provider through the real Pulumi bridge
        env:
          PULUMI_TEST: '1'
        run: go test ./tests/pulumi -count=1 -v -timeout 15m
